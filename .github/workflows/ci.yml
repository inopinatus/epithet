name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Lint runs on MRI only.
  test:
    name: test (${{ matrix.ruby }}${{ matrix.ruby_box && ' · Ruby Box' }}${{ matrix.rubyopt && format(' · {0}', matrix.rubyopt) }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: ${{ matrix.advisory || false }}
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.4", "4.0", "truffleruby", "jruby"]
        rubyopt: [""]
        ruby_box: [""]
        include:
          - { ruby: "4.0", rubyopt: "", ruby_box: "1" }
          - { ruby: "4.0", rubyopt: "--yjit" }
          - { ruby: "4.0", rubyopt: "--zjit", advisory: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test
        env:
          EPITHET_TEST_THREADS: "16"
          EPITHET_TEST_ROUNDS: "2000"
          RUBY_BOX: ${{ matrix.ruby_box }}
          RUBYOPT: ${{ matrix.rubyopt }}
      - run: bundle exec rubocop
        if: ${{ !startsWith(matrix.ruby, 'truffleruby') && !startsWith(matrix.ruby, 'jruby') && !matrix.rubyopt }}

  test-libressl:
    name: test (4.0 · OpenBSD/LibreSSL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: test under LibreSSL-linked Ruby on OpenBSD
        uses: vmactions/openbsd-vm@e6c68b637a12e83519688d115d57d5b0b53923cd # v1.4.6
        with:
          release: "7.9"
          prepare: pkg_add ruby%4.0 ruby40-ffi
          run: |
            set -e
            ruby40 -ropenssl -e '
              puts RUBY_DESCRIPTION, OpenSSL::OPENSSL_VERSION
              abort "expected LibreSSL on OpenBSD" unless OpenSSL::OPENSSL_VERSION.include?("LibreSSL")
              abort "unexpected presence of OpenSSL::KDF.scrypt" if OpenSSL::KDF.respond_to?(:scrypt)
            '
            gem40 install --no-document scrypt minitest rake
            ruby40 -w -Ilib -Itest -e 'Dir.glob("test/**/*_test.rb") { |f| require File.expand_path(f) }'

  test-32bit:
    name: test (${{ matrix.ruby }} · 32-bit)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ruby: "3.4", digest: "sha256:a323ea13cb3c19715564c3eed3dffa971d298bc3f212635a94eaa1821f10f079" }
          - { ruby: "4.0", digest: "sha256:e3934cbef739b511d4f17e7e1cad3711a946e22a2ef52226f86cc8af531d51cc" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: assert 32-bit interpreter
        run: |
          docker run --rm --platform linux/386 \
            i386/ruby:${{ matrix.ruby }}@${{ matrix.digest }} \
            ruby -e 'puts "#{RUBY_DESCRIPTION}, #{1.size * 8}-bit word"; abort "not 32-bit" unless 1.size == 4'
      - name: test under 32-bit Ruby
        run: |
          docker run --rm --platform linux/386 \
            -v "$PWD:/work" -w /work \
            i386/ruby:${{ matrix.ruby }}@${{ matrix.digest }} \
            sh -c 'bundle install && bundle exec rake test'
